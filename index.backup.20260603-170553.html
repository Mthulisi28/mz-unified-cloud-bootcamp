<!DOCTYPE html>
<html>
<head>
  <title>MZ UCA Portal V2</title>

  <style>
    body {
      font-family: Arial;
      background: #0b1220;
      color: white;
      padding: 40px;
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #status {
      text-align: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #aab4c0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #162033;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease-in-out;
      border: 1px solid transparent;
    }

    .card:hover {
      background: #22314d;
      border-color: #2f4a75;
      transform: translateY(-2px);
    }

    #message {
      text-align: center;
      margin-top: 40px;
      color: #8892a6;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>

<body>

<h1>MZ UCA Portal V2</h1>

<div id="status">Initializing...</div>

<div class="grid" id="grid"></div>

<div id="message">Loading sessions...</div>

<script>
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const message = document.getElementById('message');

async function loadSessions() {
  try {
    status.innerText = "Connecting to session registry...";

    const res = await fetch('session-registry.json');

    if (!res.ok) {
      throw new Error("HTTP Error: " + res.status);
    }

    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      throw new Error("Invalid or empty registry");
    }

    status.innerText = `Loaded ${data.length} sessions`;
    message.style.display = "none";

    data.forEach(session => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerText = session.title;

      div.onclick = function () {
        window.location.href = "session.html?id=" + session.id;
      };

      grid.appendChild(div);
    });

  } catch (err) {
    console.error(err);

    status.innerText = "Failed to load registry";
    message.className = "error";
    message.innerText =
      "System error: session registry could not be loaded.";
  }
}

loadSessions();
</script>

</body>
</html>
