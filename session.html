<!DOCTYPE html>
<html>
<head><title>Session Viewer</title><style>body{font-family:Arial;background:#0b1220;color:white;padding:40px;}.container{max-width:900px;margin:auto;background:#162033;padding:30px;border-radius:12px;}.back{color:#7aa2ff;display:inline-block;margin-top:20px;}</style></head>
<body>
<div class="container">
  <h1 id="title">Loading...</h1>
  <div id="content"></div>
  <a class="back" href="index.html">← Back to Portal</a>
</div>
<script>
async function initSessionEngine() {
  const params = new URLSearchParams(window.location.search);
  const rawId = params.get("id");
  if (!rawId) return;
  // Pointing to root as per new deployment strategy
  const targetPath = `${rawId.toLowerCase()}.pdf`; 
  document.getElementById("content").innerHTML = `
    <h3>Learning Material</h3>
    <iframe src="${targetPath}" width="100%" height="600px" style="border:1px solid #2c3e50;border-radius:10px;"></iframe>
  `;
}
window.addEventListener("DOMContentLoaded", initSessionEngine);
</script>
</body>
</html>
