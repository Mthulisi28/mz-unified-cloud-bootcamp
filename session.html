<!DOCTYPE html>
<html>
<head><title>UCA Session Viewer</title></head>
<body style="background:#0b1220; color:white; font-family:sans-serif;">
  <h1 id="title">Loading...</h1>
  <div id="content"></div>
  <script>
    async function init() {
      const id = new URLSearchParams(window.location.search).get("id");
      const res = await fetch("session-registry.json");
      const registry = await res.json();
      const session = registry.find(s => s.id === id);
      
      if (!session) {
        document.getElementById("title").innerText = "Session Not Found";
        return;
      }
      document.getElementById("title").innerText = session.title;
      // Force path to point to your unified academy-assets folder
      const path = session.file; 
      document.getElementById("content").innerHTML = `<iframe src="${path}" width="100%" height="800px"></iframe>`;
    }
    init();
  </script>
</body>
</html>
