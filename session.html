<!DOCTYPE html>
<html>
<head>
  <title>Session Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b1220; color:white; padding:40px; }
    .container { max-width:900px; margin:auto; background:#162033; padding:30px; border-radius:12px; }
    .back { color:#7aa2ff; display:inline-block; margin-top:20px; text-decoration: none; }
    iframe { border:1px solid #2c3e50; border-radius:10px; width:100%; height:600px; }
  </style>
</head>

<body>

<div class="container">
  <h1 id="title">Loading Session...</h1>
  <div id="content"></div>
  <a class="back" href="index.html">← Back to Portal</a>
</div>

<script>
async function loadSession() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get("id");

  try {
    const res = await fetch("session-registry.json");
    const data = await res.json();

    // Find the specific session by ID
    const session = data.find(s => s.id === id);

    if (!session) {
      document.getElementById("title").innerText = "Session Not Found";
      return;
    }

    document.getElementById("title").innerText = session.title;

    // Use the file path defined in your registry
    // The '../' prefix correctly steps out of the portal folder to find the root
    const pdfPath = "../" + session.file;

    document.getElementById("content").innerHTML = `
      <h3>Learning Material</h3>
      <iframe src="${pdfPath}"></iframe>
      <p>
        <a href="${pdfPath}" download style="color:#7aa2ff;">Download PDF</a>
      </p>
    `;

  } catch (e) {
    console.error("Error loading session:", e);
    document.getElementById("content").innerHTML = 
      "<p style='color:red;'>Error loading session data. Check the registry path.</p>";
  }
}

loadSession();
</script>

</body>
</html>
