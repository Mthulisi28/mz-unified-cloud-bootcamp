<!DOCTYPE html>
<html>
<body>
<h1 id="title">Loading...</h1>
<div id="content"></div>
<script>
async function init() {
  const id = new URLSearchParams(window.location.search).get("id");
  const res = await fetch("session-registry.json");
  const registry = await res.json();
  const session = registry.find(s => s.id === id);
  if (session) {
    document.getElementById('title').innerText = session.title;
    document.getElementById('content').innerHTML = '<iframe src="' + session.file + '" width="100%" height="800px"></iframe>';
  } else {
    document.getElementById('title').innerText = "Session Not Found";
  }
}
init();
</script>
</body>
</html>
