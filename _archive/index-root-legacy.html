<script>
let sessions = [];

async function loadSessions() {

  try {

    const res = await fetch("session-registry.json");
    sessions = await res.json();

    render();

    const saved =
      localStorage.getItem("session_progress");

    if (saved) {

      const found =
        sessions.find(
          x => x.id === saved
        );

      if (found) {
        selectSession(found);
        return;
      }
    }

    if (sessions.length > 0) {
      selectSession(sessions[0]);
    }

  } catch (err) {

    console.error(err);

    document.getElementById("sessions").innerHTML = `
      <div style="
        padding:20px;
        color:#ef4444;
        border:1px solid #ef4444;
        border-radius:8px;">
        Failed to load session-registry.json
      </div>
    `;
  }
}

function render() {

  const container =
    document.getElementById("sessions");

  container.innerHTML = "";

  sessions.forEach(session => {

    const div =
      document.createElement("div");

    div.className =
      "session" +
      (session.active ? " active" : "");

    div.innerHTML = `
      <div class="title">
        ◆ Session ${session.id}
        — ${session.title}
      </div>

      <div class="meta">
        ◈ ${session.duration}
      </div>
    `;

    div.onclick = () =>
      selectSession(session);

    container.appendChild(div);

  });
}

function selectSession(session) {

  document
    .querySelectorAll(".session")
    .forEach(x =>
      x.classList.remove("active")
    );

  const index =
    sessions.findIndex(
      s => s.id === session.id
    );

  if (index >= 0) {

    document
      .querySelectorAll(".session")[index]
      .classList.add("active");
  }

  localStorage.setItem(
    "session_progress",
    session.id
  );

  const player =
    document.getElementById("player");

  if (session.slideFile) {

    player.innerHTML = `
      <iframe
        src="${session.slideFile}"
        width="100%"
        height="100%"
        style="
          border:none;
          background:white;
          min-height:600px;
        ">
      </iframe>
    `;

    return;
  }

  if (
    session.youtubeId &&
    session.youtubeId !== "TBD"
  ) {

    player.innerHTML = `
      <iframe
        width="100%"
        height="100%"
        src="https://www.youtube.com/embed/${session.youtubeId}?autoplay=1"
        frameborder="0"
        allowfullscreen>
      </iframe>
    `;

    return;
  }

  player.innerHTML = `
    <div style="
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:#64748b;
      font-size:16px;">
      Slide deck not yet assigned
    </div>
  `;
}

loadSessions();
</script>
